appId: com.milesroxas.skill-studio
productName: Skill Studio
# No spaces: GitHub renames an asset with a space, and the update files would then point at nothing.
artifactName: skill-studio-${version}-${os}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/*.map"
asar: true
npmRebuild: false
# Fuses are flipped in the Electron binary before it is signed. The app then runs
# only the code in its own signed archive: not as a plain Node, not with injected
# Node flags or Node's inspector, and not from an archive changed after the build.
# Cookie encryption stays off: the app keeps no cookies, and the fuse would make
# every start reach for the system keychain.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
# Names the release the update files (latest*.yml) point at. Nothing uploads from
# here: the release workflow builds with `--publish never` and publishes once.
publish:
  provider: github
  owner: milesroxas
  repo: skill-studio
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
    - target: zip
  # Signed with the Developer ID in CSC_LINK, then notarized when the APPLE_API_*
  # variables are set. Without them a local `pnpm dist` skips both.
  hardenedRuntime: true
  darkModeSupport: true
linux:
  target:
    - AppImage
  category: Development
win:
  target:
    - nsis
