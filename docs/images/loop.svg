<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 184" width="760" height="184" role="img" aria-labelledby="loop-title loop-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="loop-title">The Skill Studio loop</title>
  <desc id="loop-desc">Write the skill's rules, run an agent on its cases, then compare the new answers with the last and pick the better. What an answer missed names the rule to change, and you go round again.</desc>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#5B605A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="head-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 9 5 1 9" fill="none" stroke="#0A1020" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="760" height="184" fill="#F4F2EB"/>

  <g fill="#FBFAF6" stroke="#CBCBCC" stroke-width="1">
    <rect x="16" y="20" width="208" height="80" rx="9"/>
    <rect x="276" y="20" width="208" height="80" rx="9"/>
    <rect x="536" y="20" width="208" height="80" rx="9"/>
  </g>

  <g fill="#5B605A" font-size="12" font-weight="500">
    <text x="32" y="43">Step 1 · Skill</text>
    <text x="292" y="43">Step 2 · Run</text>
    <text x="552" y="43">Step 3 · Results</text>
  </g>
  <g fill="#0A1020" font-size="16" font-weight="600">
    <text x="32" y="65">Write</text>
    <text x="292" y="65">Run</text>
    <text x="552" y="65">Compare</text>
  </g>
  <g fill="#5B605A" font-size="13">
    <text x="32" y="85">the skill's rules</text>
    <text x="292" y="85">an agent does the cases</text>
    <text x="552" y="85">pick the better answer</text>
  </g>

  <g fill="none" stroke="#5B605A" stroke-width="1.5" stroke-linecap="round" marker-end="url(#head)">
    <path d="M229 60H271"/>
    <path d="M489 60H531"/>
  </g>
  <path d="M640 105V136Q640 148 628 148H132Q120 148 120 136V107" fill="none" stroke="#0A1020" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#head-strong)"/>
  <text x="380" y="170" text-anchor="middle" fill="#0A1020" font-size="13" font-weight="500">what an answer missed names the rule to change</text>
</svg>
