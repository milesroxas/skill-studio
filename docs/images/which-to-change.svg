<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" role="img" aria-labelledby="change-title change-desc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="change-title">What each Agreement column tells you to change</title>
  <desc id="change-desc">A two by two grid of your mark against the judge's layer score. Both good: leave it. Both bad: change the skill. You marked it bad and the judge scored it high, or you marked it good and the judge scored it low: tune the scoring.</desc>
  <rect width="760" height="330" fill="#fcfcfa"/>

  <g fill="#6f6b63" font-size="13" font-weight="500" text-anchor="middle">
    <text x="256" y="30">The judge scored the layer high</text>
    <text x="586" y="30">The judge scored the layer low</text>
  </g>
  <g text-anchor="end">
    <text x="84" y="96" fill="#6f6b63" font-size="13" font-weight="500">You marked</text>
    <text x="84" y="116" fill="#1c1b18" font-size="16" font-weight="600">Good</text>
    <text x="84" y="218" fill="#6f6b63" font-size="13" font-weight="500">You marked</text>
    <text x="84" y="238" fill="#1c1b18" font-size="16" font-weight="600">Bad</text>
  </g>

  <g stroke="#d9d6cf" stroke-width="1">
    <rect x="96" y="44" width="320" height="112" rx="9" fill="#ffffff"/>
    <rect x="426" y="44" width="320" height="112" rx="9" fill="#fbf3e2"/>
    <rect x="96" y="166" width="320" height="112" rx="9" fill="#fbf3e2"/>
    <rect x="426" y="166" width="320" height="112" rx="9" fill="#fbeae7"/>
  </g>

  <g font-size="12" font-weight="500">
    <text x="114" y="70" fill="#6f6b63">Both good</text>
    <text x="444" y="70" fill="#8a5a00">Too harsh</text>
    <text x="114" y="192" fill="#8a5a00">Judge missed</text>
    <text x="444" y="192" fill="#a3271c">Both bad</text>
  </g>
  <g fill="#1c1b18" font-size="17" font-weight="600">
    <text x="114" y="96">Leave it</text>
    <text x="444" y="96">Tune the scoring</text>
    <text x="114" y="218">Tune the scoring</text>
    <text x="444" y="218">Change the skill</text>
  </g>
  <g fill="#4a4741" font-size="13">
    <text x="114" y="120">The layer holds.</text>
    <text x="444" y="120">The judge fails an answer you would ship.</text>
    <text x="444" y="139">Go to step 8.</text>
    <text x="114" y="242">The judge passes an answer you would not.</text>
    <text x="114" y="261">Go to step 8.</text>
    <text x="444" y="242">You both find the answer short.</text>
    <text x="444" y="261">Go to step 2, then run again.</text>
  </g>

  <text x="96" y="308" fill="#6f6b63" font-size="12.5">High means at or above "Good at" in Scoring: 70 unless you change it.</text>
</svg>
