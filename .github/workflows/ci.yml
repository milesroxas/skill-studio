name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks before it publishes.
  workflow_call:

permissions:
  contents: read

# `github.workflow` is the caller's name when called, so a release never queues behind main's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the pnpm in `packageManager` and the Node in `devEngines.runtime`,
      # then runs `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fallow
      - run: pnpm test
      - run: pnpm build
