name: ci

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs the same checks before it publishes.
  workflow_call:

permissions:
  contents: read

# `github.workflow` is the caller's name when called, so a release never queues behind main's run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Nothing here runs the app, so the root postinstall need not fetch its binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the pnpm in `packageManager` and the Node in `devEngines.runtime`,
      # then runs `pnpm install --frozen-lockfile`.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm fallow
      - run: pnpm test
      - run: pnpm build

  # The process and path code branches by platform, so the tests run where the
  # app ships too. `check` keeps its name: a required status check is named for it.
  test-macos:
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - run: pnpm test

  # The tests that need a POSIX shell or POSIX links skip here; the rest run as on
  # macOS, so a change that breaks a Windows path fails the run.
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - run: pnpm test
