name: release

# A `v*` tag builds every platform, signs and notarizes the Mac app, and
# publishes one GitHub release. A manual run is a rehearsal: it builds and
# keeps the files as workflow artifacts, and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: read
        name: Read the version, and hold a tag to it
        run: |
          version=$(jq -r .version package.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" != tag ]; then exit 0; fi
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $version in package.json."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main."
            exit 1
          fi

  mac:
    needs: version
    runs-on: macos-latest
    timeout-minutes: 45
    # The signing secrets live in this environment, so no other job can read them.
    environment: release
    env:
      SIGNED: ${{ secrets.CSC_LINK != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER != '' }}
    steps:
      - name: Refuse to release an unsigned app
        if: github.ref_type == 'tag' && env.SIGNED != 'true'
        run: |
          echo "::error::The release environment is missing signing secrets. See Releasing in CONTRIBUTING.md."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache in this workflow: what it builds is what people install.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true
      - run: pnpm build
      - name: Package, sign and notarize
        if: env.SIGNED == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # electron-builder takes the key as a file, not as its text.
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
          APPLE_API_KEY="$key" pnpm exec electron-builder --mac --arm64 --x64 --publish never
          rm "$key"
      - name: Check both apps are signed and carry a notarization ticket
        if: env.SIGNED == 'true'
        run: |
          for app in dist/mac*/*.app; do
            codesign --verify --deep --strict "$app"
            xcrun stapler validate "$app"
          done
      - name: Package unsigned, for a rehearsal
        if: env.SIGNED != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --mac --arm64 --x64 --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac
          path: |
            dist/skill-studio-*
            dist/*.yml
            !dist/builder-debug.yml
          if-no-files-found: error
          retention-days: 7

  package:
    needs: version
    strategy:
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            target: --linux
          - name: windows
            os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true
      - run: pnpm build
      - run: pnpm exec electron-builder ${{ matrix.target }} --x64 --publish never
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: |
            dist/skill-studio-*
            dist/*.yml
            !dist/builder-debug.yml
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref_type == 'tag'
    needs: [check, version, mac, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign the provenance
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # Lets anyone confirm a download was built here: gh attestation verify <file> -R <repo>
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # 1.2.0-beta.1 and the like are prereleases, and never "latest".
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Skill Studio $VERSION" \
            --generate-notes \
            "${flags[@]}"
