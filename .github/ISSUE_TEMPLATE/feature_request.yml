name: Feature request
description: A new pack, engine, screen or command.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to evaluate or review, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you would add or change. For a new pack, name its layers and which are code checks and which are Jev questions.
